[package]
name = "aperture"
version = "0.3.0"
edition = "2021"
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tokio-tungstenite", "dep:futures-util"]
[[bin]]
name = "aperture"
path = "src/main.rs"
required-features = ["desktop"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time"] }

tauri-plugin-opener = { version = "2", optional = true }

tauri-plugin-dialog = { version = "2", optional = true }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
