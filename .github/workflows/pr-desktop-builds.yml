name: PR desktop builds
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-desktop-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Only the Mac build feeds Homebrew. A slow or broken Linux/Windows build
    # is reported on the job but does not fail the run or hold back the release.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            optional: true
            timeout: 30
            os: ubuntu-24.04
            args: --bundles deb,appimage
          - platform: windows-x64
            optional: true
            timeout: 45
            os: windows-2022
            args: --bundles nsis
          - platform: macos-universal
            optional: false
            timeout: 60
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install both Mac targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib
      - name: Browser tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Bundle Python and GS Quant
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            node scripts/bundle-python.cjs aarch64-apple-darwin x86_64-apple-darwin
          else
            node scripts/bundle-python.cjs
          fi
      - run: npm run tauri build -- ${{ matrix.args }}
      - name: Launch built app (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb
          set +e
          timeout 20 xvfb-run -a src-tauri/target/release/aperture
          code=$?
          if [ "$code" -ne 124 ]; then
            echo "Aperture exited after launch with code $code (expected to still be running)"
            exit 1
          fi
          echo "Aperture started and stayed running for 20 seconds"
      - name: Collect installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          platform = os.environ['PLATFORM']
          out = Path('installers')
          out.mkdir()
          extensions = {'linux-x64': ['.deb', '.AppImage'], 'windows-x64': ['.exe'], 'macos-universal': ['.dmg']}[platform]
          for ext in extensions:
              files = list(Path('src-tauri/target').glob('**/release/bundle/**/*' + ext))
              if len(files) != 1:
                  raise SystemExit(f'Expected one {ext} installer, got {len(files)}')
              shutil.copy2(files[0], out / ('Aperture-' + platform + ext))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Aperture-${{ matrix.platform }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
