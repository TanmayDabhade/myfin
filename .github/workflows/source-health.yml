name: Source health
# Live contract checks against the public data providers, so a provider
# changing its API shows up here instead of in the app.
on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Live provider contract tests (SEC EDGAR, Twelve Data and Alpha Vantage demo keys)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib -- --ignored
